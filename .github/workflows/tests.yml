name: Python verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run behavior tests
        run: python -m pytest -q
      - name: Verify frozen bytes
        working-directory: datasets/smoke-v1
        run: sha256sum -c SHA256SUMS
      - name: Run examples outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          INQUEST_CHECKOUT: ${{ github.workspace }}
        run: |
          for example in generate_incident load_frozen_set inspect_incident grade_report; do
            python "$INQUEST_CHECKOUT/examples/$example.py"
          done
