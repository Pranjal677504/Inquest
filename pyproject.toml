[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inquest"
version = "0.1.0"
description = "Replayable synthetic incidents for investigating microservice failures"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["Flask>=3.1,<4"]

[project.scripts]
inquest = "inquest.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
